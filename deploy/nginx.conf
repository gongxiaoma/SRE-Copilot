# 放入 nginx http 上下文的 conf.d；替换域名、证书和静态目录后执行 nginx -t。
server {
    listen 80;
    server_name holmes.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name holmes.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 在公开暴露前接入企业 SSO/auth_request 或受控 VPN；本示例不提供用户认证服务。
    location = /api/chat {
        limit_except POST { deny all; }
        proxy_pass http://172.16.119.92:30395/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 默认剥离浏览器提供的上游 API key。若启用 Holmes 认证，仅在服务端安全注入。
        proxy_set_header X-API-Key "";
        proxy_set_header Authorization "";
        # 可将上面两行替换为运维管理的 include，不要把真实密钥放进前端或仓库。
        # include /etc/nginx/private/holmes-upstream-auth.conf;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        gzip off;
        proxy_set_header Accept-Encoding "";
    }
    location /api/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
